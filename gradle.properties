# Locked build settings for media-workspace.
# Version matrix is pinned in gradle/libs.versions.toml. No dynamic versions.

group=com.mediaworkspace
version=0.1.0

# Build JVM is capped so several Gradle workers can coexist with MySQL/Kafka/Jenkins
# on the 2 vCPU / 2 GiB demo host. See docs/runbook.md for the measured memory budget.
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Test JVMs run in their own process with a bounded heap.
systemProp.mediaworkspace.test.jvmargs=-Xmx384m
