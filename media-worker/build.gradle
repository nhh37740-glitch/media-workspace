// Executable worker application: Kafka intake, lease scheduling, transcode execution. No public port.
apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':adapter-persistence')
    implementation project(':adapter-storage')
    implementation project(':adapter-messaging')
    implementation project(':adapter-transcode')
    implementation project(':media-application')
    implementation project(':media-domain')
    implementation project(':media-contracts')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // A servlet container, bound to loopback, only so the actuator health endpoint exists. A worker
    // whose database is unreachable must stop claiming, and an operator needs a way to see that
    // without reading the log. This is not a business port: it serves no application route.
    implementation 'org.springframework.boot:spring-boot-starter-web'
}

bootJar {
    archiveFileName = "media-worker-${project.version}.jar"
}
