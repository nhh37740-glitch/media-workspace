# Exact version matrix. Every entry was resolved against Maven Central during G0.
# Managed transitively by spring-boot-dependencies:3.5.16 unless listed separately.
[versions]
springBoot = "3.5.16"
springDependencyManagement = "1.1.7"
mybatisSpringBoot = "3.0.4"
# Transitive pins recorded here for the version matrix document (asserted by VersionMatrixTest).
springFramework = "6.2.19"
springSecurity = "6.5.11"
tomcat = "10.1.55"
flyway = "11.7.2"
mysqlConnector = "9.7.0"
kafkaClients = "3.9.2"
springKafka = "3.3.16"
jackson = "2.21.4"
logback = "1.5.34"
junit = "5.12.2"
assertj = "3.27.7"

[libraries]
mybatis-spring-boot-starter = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter", version.ref = "mybatisSpringBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-session-jdbc = { module = "org.springframework.session:spring-session-jdbc" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
