# Single-node KRaft broker for the demo topology.
#
# Single replica is a development convenience, not high availability: losing this broker loses
# the unconsumed topic contents. Durable intent lives in MySQL (outbox), so a broker outage
# delays processing instead of losing it. Bound to loopback; never exposed publicly.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://127.0.0.1:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=@KAFKA_LOG_DIR@
num.partitions=3
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

num.network.threads=2
num.io.threads=2
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

log.retention.hours=168
log.retention.bytes=2147483648
log.segment.bytes=268435456
log.retention.check.interval.ms=300000

group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
