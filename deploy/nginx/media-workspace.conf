# Nginx front end for the demonstration deployment.
#
# This is the only publicly listening port of the project. The API, MySQL, Kafka and Jenkins are
# bound to loopback and are reached by a client only through this server, or through an SSH tunnel
# for the tools that have no business being public.
#
# Two details are load-bearing rather than tuning:
#   * response buffering is off for the event stream, or frames would be held in a buffer and
#     delivered in bursts, which defeats the point of streaming;
#   * the media root is never served directly. Bytes leave through the API, which performs the
#     authorization; a direct static mapping would hand out every file to anyone who guessed a path.

upstream media_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    charset utf-8;
    server_tokens off;

    # A chunk is 8 MiB by default, so the transport limit must exceed it. The application still
    # enforces its own per-chunk bound; this only stops an oversized body before it reaches Java.
    client_max_body_size 16m;
    client_body_timeout 60s;

    access_log /var/log/nginx/media-workspace.access.log;
    error_log  /var/log/nginx/media-workspace.error.log warn;

    # The single-page application. The release's web/ directory is mounted here by the deploy step.
    root /opt/media-workspace/current/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset names are immutable, so they may be cached hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://media_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # A transcode can take minutes and the browser may hold a request open while polling;
        # these bounds are for the request itself, not for the task it starts.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Range requests must reach the application unchanged: it is the component that decides
        # what a range means and what is authorized to receive it.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;

        # The API sets the request id; passing any client value through is explicitly not done.
        proxy_set_header X-Request-Id "";
    }

    # The event stream must not be buffered or cached, and it needs a long read timeout because a
    # quiet task legitimately sends nothing but heartbeats.
    location ~ ^/api/v1/tasks/[^/]+/events$ {
        proxy_pass http://media_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-store";
    }

    # Health is useful to an operator on the host and is not part of the public surface.
    location /actuator/ {
        deny all;
        return 404;
    }

    # Nothing under the storage volume is reachable through the web server, by construction: this
    # location exists only to make that explicit and to return a definite answer.
    location /storage/ {
        deny all;
        return 404;
    }
}
