rootProject.name = 'media-workspace'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

include 'media-contracts'
include 'media-domain'
include 'media-application'
include 'adapter-persistence'
include 'adapter-messaging'
include 'adapter-transcode'
include 'adapter-storage'
include 'media-api'
include 'media-worker'

// End-to-end and fault-injection tests. Owned by build-delivery: they exercise several modules
// together, so attributing a failure to one of them from here would be guessing.
include 'tests:e2e'
