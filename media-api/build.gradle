// Executable API application: HTTP mapping, security/SSE boundary, upload finalizer scheduling, wiring.
apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':adapter-persistence')
    implementation project(':adapter-storage')
    implementation project(':adapter-messaging')
    implementation project(':media-application')
    implementation project(':media-domain')
    implementation project(':media-contracts')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation libs.spring.boot.starter.session.jdbc
    testImplementation 'org.springframework.security:spring-security-test'
}

bootJar {
    archiveFileName = "media-api-${project.version}.jar"
}
